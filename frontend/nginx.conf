server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed build assets never change: cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/overview, /backtests/7, ...) all serve the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
