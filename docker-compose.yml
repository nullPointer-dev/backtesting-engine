# Postgres + API + web app.
#
#   cp .env.example .env              # then set JWT_SECRET_KEY
#   docker compose up --build -d
#   docker compose run --rm api python main.py --symbols RELIANCE.NS,TCS.NS --timeframes 1d
#   open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backtester
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backtester}
      POSTGRES_DB: backtesting_engine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backtester -d backtesting_engine"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DB_URL: postgresql://backtester:${POSTGRES_PASSWORD:-backtester}@db:5432/backtesting_engine
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (see .env.example)}
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
      BACKTEST_WORKERS: ${BACKTEST_WORKERS:-2}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
